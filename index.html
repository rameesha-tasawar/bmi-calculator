<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
   
    <form onsubmit="calculateBMI(); return false;">

        <div>
            <label for="weight">Weight (kg):</label>
            <input type="number" name="weight" id="weight" placeholder="Enter your weight in kg" required>
        </div>
        <br>
        <div>
            <label for="height">Height (m):</label>
            <input type="text" name="height" id="height" placeholder="Enter your height in meter" required>
        </div>
        <br>
        <button type="submit">Calculate BMI</button>
    </form>
    <br>
    <div id="bmi"></div>
    
    <div id="names"></div>

    <div id="products"></div>

    <script src="./index.js"></script>
</body>
</html>
